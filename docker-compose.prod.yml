# Homelab production deployment.
#
# Diverges from the upstream self-contained prod compose: this host runs one
# shared platform stack (/root/platform), so the app joins the external
# `backend` network to reach the shared Postgres + Valkey and the external
# `web` network so the platform Traefik can route to it. No bundled postgres/
# valkey services, no published ports.
#
# Public hostnames phostrich.com + www.phostrich.com -> this container:3000,
# declared in /root/platform/traefik/dynamic/dynamic.yml (file provider).
# Traefik must pass /.well-known/nostr.json through untouched — no redirect,
# and it must not strip the app's Access-Control-Allow-Origin header.

networks:
  backend:
    external: true
  web:
    external: true

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      ORIGIN: ${PUBLIC_ORIGIN}
      DEFAULT_RELAYS: ${DEFAULT_RELAYS}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS}
      ADMIN_PUBKEYS: ${ADMIN_PUBKEYS}
      # adapter-node sits behind Traefik: trust its forwarded headers so
      # origin checks and getClientAddress()-based rate limiting are correct.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
    expose:
      - '3000'
    networks:
      - default
      - backend
      - web
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to [::1] first,
      # but adapter-node binds IPv4 0.0.0.0, so the IPv6 attempt is refused.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ['pnpm', 'db:migrate']
    env_file:
      - .env
    # DATABASE_URL is all the migration itself uses, but scripts/migrate.ts
    # imports src/lib/server/db, which loads config.ts and validates the full
    # env schema at module load — so VALKEY_URL and PUBLIC_ORIGIN must be present.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    networks:
      - default
      - backend
    restart: 'no'
