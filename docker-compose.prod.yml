services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      ORIGIN: ${PUBLIC_ORIGIN}
      DEFAULT_RELAYS: ${DEFAULT_RELAYS}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS}
      ADMIN_PUBKEYS: ${ADMIN_PUBKEYS}
    # No published ports: the app listens on 3000 inside the compose network and
    # expects an external reverse proxy (Traefik, etc.) to terminate TLS and
    # route to it. The proxy must pass /.well-known/nostr.json through untouched
    # — no redirect, and keep the app's Access-Control-Allow-Origin header.
    expose:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to [::1] first,
      # but adapter-node binds IPv4 0.0.0.0, so the IPv6 attempt is refused.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ['pnpm', 'db:migrate']
    # DATABASE_URL is all the migration itself uses, but scripts/migrate.ts
    # imports src/lib/server/db, which loads config.ts and validates the full
    # env schema at module load — so VALKEY_URL and PUBLIC_ORIGIN must be present.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phostrich
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: phostrich
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phostrich']
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

volumes:
  postgres-data:
