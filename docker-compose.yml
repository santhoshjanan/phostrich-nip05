services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phostrich
      POSTGRES_PASSWORD: phostrich
      POSTGRES_DB: phostrich
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6379:6379'

volumes:
  postgres-data:
