name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phostrich
          POSTGRES_PASSWORD: phostrich
          POSTGRES_DB: phostrich
        options: >-
          --health-cmd "pg_isready -U phostrich"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
    env:
      # Jobs run in a container on a per-job network; reach services by name,
      # not localhost, and don't publish host ports (they collide on a
      # self-hosted runner that shares the box with other services).
      DATABASE_URL: postgres://phostrich:phostrich@postgres:5432/phostrich
      VALKEY_URL: redis://valkey:6379
      PUBLIC_ORIGIN: http://localhost:4173
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t phostrich:ci .
